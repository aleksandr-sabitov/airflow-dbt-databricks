
name: 'wanderbricks'
version: '1.0.0'
config-version: 2

profile: 'wanderbricks'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by 'dbt clean'
  - "target"
  - "dbt_packages"

models:
  wanderbricks:
    # Config for all models
    staging:
      materialized: view
      schema: staging
    star_schema:
      materialized: table
      schema: star_schema
    datamarts:
      materialized: table
      schema: datamarts
      +persist_docs:
        relation: true
        columns: true
