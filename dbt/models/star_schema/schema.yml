
version: 2

models:
  - name: dim_users
    description: Dimension table for users
    columns:
      - name: user_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: email
      - name: name
      - name: country
      - name: user_type
      - name: created_at
      - name: is_business
      - name: company_name

  - name: dim_properties
    description: Dimension table for properties
    columns:
      - name: property_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: host_id
      - name: destination_id
      - name: title
      - name: description
      - name: base_price
      - name: property_type
      - name: max_guests
      - name: bedrooms
      - name: bathrooms
      - name: property_latitude
      - name: property_longitude
      - name: created_at

  - name: fct_bookings
    description: Fact table for bookings
    columns:
      - name: booking_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_users')
              field: user_id
      - name: property_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_properties')
              field: property_id
      - name: check_in
      - name: check_out
      - name: guests_count
      - name: total_amount
      - name: status
      - name: created_at
      - name: updated_at
